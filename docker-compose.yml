services:
  memory-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Optional: enables LLM extraction (the high-quality path). Without it
      # the service still runs, using the rule-based fallback extractor.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Optional: model override for extraction.
      - MEMORY_LLM_MODEL=${MEMORY_LLM_MODEL:-claude-opus-4-8}
      # Optional: if set, all endpoints except /health require
      # "Authorization: Bearer <token>".
      - MEMORY_AUTH_TOKEN=${MEMORY_AUTH_TOKEN:-}
      # Tuning knobs (defaults are calibrated — see .env.example/CHANGELOG).
      - MEMORY_EMBEDDING_MODEL=${MEMORY_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - MEMORY_DENSE_FLOOR=${MEMORY_DENSE_FLOOR:-0.62}
      - MEMORY_DENSE_FLOOR_LOW=${MEMORY_DENSE_FLOOR_LOW:-0.50}
      - MEMORY_TERM_FLOOR=${MEMORY_TERM_FLOOR:-0.52}
      - MEMORY_RRF_K=${MEMORY_RRF_K:-60}
      - MEMORY_HOP_DAMPING=${MEMORY_HOP_DAMPING:-0.5}
      - MEMORY_LLM_TIMEOUT_S=${MEMORY_LLM_TIMEOUT_S:-20}
      - MEMORY_LLM_MAX_RETRIES=${MEMORY_LLM_MAX_RETRIES:-1}
      - MEMORY_EXTRACTION_DEADLINE_S=${MEMORY_EXTRACTION_DEADLINE_S:-40}
    volumes:
      - memory-data:/data
    restart: unless-stopped

volumes:
  memory-data:
